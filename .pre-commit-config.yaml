repos:
  # ── Checks generales ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  # ── Python: Ruff (linting + import sort) ────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── TypeScript/HTML/SCSS: ESLint + Prettier ──────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'set -e; export NVM_DIR="$HOME/.nvm"; if ! command -v pnpm >/dev/null 2>&1 && [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use --silent; fi; if ! command -v pnpm >/dev/null 2>&1 && command -v corepack >/dev/null 2>&1; then corepack enable; fi; files=(); for file in "$@"; do files+=("${file#frontend/}"); done; cd frontend && pnpm exec eslint --fix "${files[@]}"' --
        files: ^frontend/src/.*\.(ts|html)$

      - id: prettier
        name: prettier
        language: system
        entry: bash -c 'set -e; export NVM_DIR="$HOME/.nvm"; if ! command -v pnpm >/dev/null 2>&1 && [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use --silent; fi; if ! command -v pnpm >/dev/null 2>&1 && command -v corepack >/dev/null 2>&1; then corepack enable; fi; files=(); for file in "$@"; do files+=("${file#frontend/}"); done; cd frontend && pnpm exec prettier --write "${files[@]}"' --
        files: ^frontend/src/.*\.(ts|html|scss)$
