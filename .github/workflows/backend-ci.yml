name: Backend CI

on:
  push:
    paths:
      - ".github/workflows/backend-ci.yml"
      - ".husky/**"
      - ".pre-commit-config.yaml"
      - "backend/**"
      - "docker-compose.test.yml"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - ".husky/**"
      - ".pre-commit-config.yaml"
      - "backend/**"
      - "docker-compose.test.yml"
      - "scripts/**"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff==0.15.13
      - name: Check lint
        run: ruff check .
      - name: Check format
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt mypy==2.1.0
      - name: Run mypy
        run: >
          python -m mypy
          api/ application/ domain/ infrastructure/ config.py main.py
          --config-file pyproject.toml
          --explicit-package-bases

  test:
    name: Tests & Coverage (pytest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alcor_test
          MYSQL_USER: alcor
          MYSQL_PASSWORD: alcor_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_USER: alcor
      DB_PASS: alcor_pass
      DB_NAME: alcor_test
      DB_PORT: 3306
      ALCOR_IGNORE_ENV_FILE: 1
      DEBUG: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load baseline schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import pymysql

          schema_path = Path("tests/fixtures/baseline_schema.sql")
          connection = pymysql.connect(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASS"],
              database=os.environ["DB_NAME"],
              autocommit=True,
          )

          try:
              with connection.cursor() as cursor:
                  for statement in schema_path.read_text().split(";"):
                      statement = statement.strip()
                      if statement:
                          cursor.execute(statement)
          finally:
              connection.close()
          PY
      - name: Mark baseline revision
        run: alembic stamp c796a5e365dc
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: python -m pytest tests/ --cov --cov-report=term-missing
