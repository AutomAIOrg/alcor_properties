# Orquestación de producción en VPS.
# MySQL NO se incluye: usar la base de datos externa del cliente.
#
# Uso:
#   cp .env.production.example .env.production   # rellenar valores reales
#   docker compose -f docker-compose.prod.yml config
#   docker compose -f docker-compose.prod.yml up -d --build

name: alcor-prod

services:
  migrate:
    image: alcor-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      ALCOR_IGNORE_ENV_FILE: "1"
    entrypoint: ["alembic"]
    command: ["upgrade", "heads"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: alcor-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      ALCOR_IGNORE_ENV_FILE: "1"
      # IP fija de Caddy en la red de proxy dedicada.
      AUTH_TRUSTED_PROXY_CIDRS: "172.30.253.3/32"
    expose:
      - "8000"
    networks:
      default:
      auth_proxy:
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bill-docs-retry:
    image: alcor-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      ALCOR_IGNORE_ENV_FILE: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python scripts/retry_bill_documents.py || true
          sleep 3600
        done
    healthcheck:
      disable: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: alcor-web:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8080:80"
    networks:
      auth_proxy:
        ipv4_address: 172.30.253.3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

networks:
  auth_proxy:
    ipam:
      config:
        - subnet: 172.30.253.0/29
          gateway: 172.30.253.1
